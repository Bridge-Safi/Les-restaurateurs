kind = "web"
previewPath = "/"
title = "Bridge Restaurant — Tableau de bord"
version = "1.0.0"
id = "artifacts/restaurant-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23683

[services.development]
run = "pnpm --filter @workspace/restaurant-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/restaurant-dashboard", "run", "build" ]
publicDir = "artifacts/restaurant-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23683"
BASE_PATH = "/"
